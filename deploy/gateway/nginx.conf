worker_processes 2;
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_body_buffer_size 128k;
    limit_req_zone $binary_remote_addr zone=per_client:10m rate=5r/s;
    limit_req_status 429;
    # HTTP/1.x bodies require Content-Length or Transfer-Encoding. At most two
    # large or chunked bodies can occupy the 64 MiB tmpfs. Fixed bodies below
    # 100,000 bytes fit in memory and do not tie up slots during SSE responses.
    map "$http_content_length|$http_transfer_encoding" $body_capacity_key {
        default "body";
        "|" "";
        "~^[0-9]{1,5}[|]$" "";
    }
    limit_conn_zone $body_capacity_key zone=body_capacity:1m;
    limit_conn_status 429;

    upstream medical_rag_backend {
        server medical-rag-api:8000;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        client_max_body_size 20m;
        limit_req zone=per_client burst=20 nodelay;
        limit_conn body_capacity 2;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;

        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        location @too_large {
            default_type application/json;
            return 413 '{"success":false,"data":null,"error":{"code":"FILE_TOO_LARGE","message":"请求体超过网关限制"}}';
        }
        location @rate_limited {
            default_type application/json;
            return 429 '{"success":false,"data":null,"error":{"code":"RATE_LIMITED","message":"请求过于频繁"}}';
        }

        location / {
            proxy_pass http://medical_rag_backend;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header Last-Event-ID $http_last_event_id;
            proxy_set_header X-Request-ID $request_id;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 180s;
        }
    }
}
