services:
  gateway:
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ./deploy/gateway/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ${GATEWAY_TLS_CERT:?Set GATEWAY_TLS_CERT to an existing certificate file}
        target: /run/tls/tls.crt
        read_only: true
      - type: bind
        source: ${GATEWAY_TLS_KEY:?Set GATEWAY_TLS_KEY to an existing private key file}
        target: /run/tls/tls.key
        read_only: true
    networks:
      - edge
      - backend

networks:
  edge: {}
  backend:
    external: true
    name: ${GATEWAY_BACKEND_NETWORK:?Set GATEWAY_BACKEND_NETWORK to an isolated internal network}
