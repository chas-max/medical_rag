[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag"
version = "0.1.0"
description = "Evidence-grounded retrieval over public Chinese medical materials"
requires-python = ">=3.11"
dependencies = [
    "aio-pika==10.2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "pypdf>=5.0",
    "pymilvus>=2.5.11,<2.7",
    "sentence-transformers>=3.0",
    "openai>=1.60",
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.15.1,<3",
    "Authlib>=1.9.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=1.0", "pymupdf>=1.25", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires running Milvus Standalone"]
