[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-rag"
version = "0.1.0"
description = "Evidence-grounded retrieval over public Chinese medical materials"
requires-python = ">=3.11"
dependencies = [
    "aio-pika==10.2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "pypdf>=5.0",
    "pymilvus>=2.5.11,<2.7",
    "sentence-transformers>=3.0",
    # HTTP clients use a deliberate two-stack split. The application code and
    # OpenAI 1.x speak httpx; Starlette >=1.10 TestClient speaks httpx2. Both
    # modules can coexist, but leaving either range open lets a fresh install
    # resolve a mismatched pair (e.g. OpenAI 3.x dropping httpx, or httpx 0.29).
    "openai>=1.60,<2",
    "httpx>=0.27,<0.29",
    "httpx2>=2.16,<3",
    "certifi>=2024.2.2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.15.1,<3",
    "Authlib>=1.9.1,<2",
    # 统一日志：轮转/保留期/压缩都由 loguru 内置实现，无需额外依赖。
    "loguru>=0.7.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=1.0", "pymupdf>=1.25", "ruff>=0.9"]
# Optional local Streamlit console (tenant login, RAG Q&A, metrics). Deliberately
# not part of the default install: CI and the serving processes do not need
# pyarrow/altair, and the console must never be exposed as a service.
ui = ["streamlit>=1.40,<2"]
# Optional offline evaluation backend. Ragas does not pin langchain/instructor;
# their current releases require openai>=2, while this project deliberately
# pins openai<2. These are the last compatible 0.3.x/1.x lines.
ragas = [
    "ragas==0.4.4",
    "langchain==0.3.27",
    "langchain-core==0.3.86",
    "langchain-community==0.3.28",
    "langchain-openai==0.3.30",
    "instructor==1.11.3",
]

[project.scripts]
medical-rag-ui = "medical_rag.ui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running Milvus Standalone",
    "pinned_release: requires the local medical-health release PDFs (gitignored, data/*.pdf)",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
